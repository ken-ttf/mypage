・総論
	日本は世界第二位の経済大国だった。

・第一次産業
	日本の農業、林業、水産業は規模が小さかった（稲作を除く）。
	日本の食糧確保は大量の輸入によってまかなわれていた。

・第二次産業
	日本の経済を支えているのは工業であり、また工業を支える貿易だった。
	日本の産業は加工業が中心だった。
	日本は無資源国で、原料やエネルギー資源は全面的に輸入に頼っていた。

・第三次産業

・対外関係
	日本は世界唯一の超大国である米国とは同盟関係にあった。
	日本はアジア近隣諸国の一部から敵視政策を取られていた。

・エネルギー
	国内資源は乏しく、時代遅れであったり（石炭）、供給量が小さかったり（天然ガス）など、国内需要をまかなえなかった。
	領海内には石油や天然ガスを含む天然資源が埋蔵されている可能性があったが、近隣諸国との政治的問題（領有権主張）から開発が遅れていた。
	このため国外（特に中東地域）からの石油輸入に大きく依存していた。
	原子力開発は国際石油資本などの介入もあり、頓挫したも同然の状態だった。

・国内問題
	西洋化や物質的な充足とともに、道徳の乱れや社会常識の欠落、偏向思想の台頭などが目立ってきた。
	高齢化に伴う生産性の低下、個人消費の鈍化、福祉予算の増加によって経済への圧迫が顕在化してきた。
	

・地理的条件
	アジア圏の島国であり、海洋国家として発展するための好条件下にあった。
	中緯度で、気候は概して温暖であり、また水資源は豊富だったので、生活環境としては恵まれていた。
	国土面積はあまり広くはなく、平野部は限られていたので、都市部に人口が集中した。
	肥沃な土地はそれなりに存在した（が農業は盛んではなかった）。
	海産物は近海から豊富に採ることができた。
	地下資源には乏しかった。

・軍事
	日本は名目上「軍隊」を持たず、防衛組織である「自衛隊」のみを有していた。
	日本は憲法により、対外侵略を行わないことが定められていた。
	

・世界情勢
	


・食料の確保
	培養食料の生産に関する研究の推進。

・情報の確保
	21世紀初頭から始まった日中韓によるIT標準規格制定を足がかりとし、これをアジア・アフリカ方面の未発達地域に対する経済支援策の一環として無償開放。その実績をもってこの「DAK規格」は国際的標準規格の一として認定される。
	
	さらに反米を是とする欧州（主に仏独）から同規格への参画同意を取り付けるに至り、米・英・露・豪を除くほぼ全世界に（一応の）普及をさせることに成功する。

　“災厄”後に世界で唯一の超大国なった日本……しかし実のところ、“災厄”前においても日本は世界第2位の経済大国であり、世界でも有数の平和で豊かな国家だった。その日本が何故、何のために、現在の姿に至ったのか。“災厄”を利用し、鎖国政策を取ってまで、一国主義による覇権を確立するという道を選んだその理由は何だったのか。
　結論から先に述べれば、“災厄”と日本とはそもそも不可分の関係にある。“災厄”後の世界情勢を考えるに当たり、まず最初に考えなければならないのは他でもない、日本の動きについてである。

　かつての日本が世界第2位の経済大国であったことは紛れもない事実である。しかしその繁栄が砂上の楼閣に過ぎないことは常々指摘されていた。

だいいちじ‐さんぎょう【第一次産業】‥ｹﾞﾌ
産業のうち、農業・林業・水産業など直接自然に働きかけるものをいう。
	自然に働きかけて材料の製造を行う産業 
	農業、林業、畜産業、水産業、狩猟など 

だいにじ‐さんぎょう【第二次産業】‥ｹﾞﾌ
産業のうち、地下資源をとりだす鉱業と、鉱産物・農林水産物などをさらに二次的に加工する工業をいう。工業には製造業(狭義の工業)と建設業とが含まれる。
	（第一次産業が生産した）材料を加工して工業製品をつくる産業。 
	製造業、建設業、鉱業、工業 

だいさんじ‐さんぎょう【第三次産業】‥ｹﾞﾌ
商業・運輸通信業・サービス業など、第一次・第二次産業以外のすべての産業を指す。
	第一次産業にも第二次産業にも分類されない産業。情報・知識を集約する点に特徴がある。 
	金融業-保険業、流通業-小売業-卸売業、サービス業-飲食業、運輸業、通信業、商業など
